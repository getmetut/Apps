        "Unfolloff offre un abbonamento Premium mensile facoltativo che rimuove gli annunci. I pagamenti sono elaborati interamente da Google Play Billing o dall'App Store di Apple — Unfolloff non riceve né conserva mai il numero della tua carta o altri dati di pagamento. Riceviamo e memorizziamo localmente solo lo stato dell'abbonamento (attivo/inattivo) per sbloccare le funzionalità Premium sul tuo dispositivo."],

      ["6. Il tuo controllo sui dati",
        "Poiché i dati della tua esportazione Instagram sono memorizzati solo sul tuo dispositivo, hai sempre il controllo: elimina singole importazioni dalla schermata Cronologia, oppure rimuovi tutto disinstallando l'app. Per gestire la personalizzazione degli annunci, usa le impostazioni di sistema del dispositivo. Per gestire o annullare l'abbonamento, usa la schermata di gestione abbonamenti di Google Play o App Store."],
      ["7. Minori",

      ["8. Modifiche a questa informativa",
        "Potremmo aggiornare periodicamente questa informativa. La data \"Ultimo aggiornamento\" in alto riflette la revisione più recente. L'uso continuato dell'app dopo una modifica implica l'accettazione dell'informativa aggiornata."],

        "لا يستخدم Unfolloff أدوات تحليلات أو تقارير أعطال، ولا يتطلب حسابًا أو تسجيل دخول، ولا يطلب اسمك أو بريدك الإلكتروني أو رقم هاتفك."],
      ["٦. تحكمك في بياناتك",
        "بما أن بيانات تصدير إنستغرام الخاصة بك تُخزَّن على جهازك فقط، فأنت دائمًا المتحكم بها: احذف عمليات استيراد فردية من شاشة \"السجل\"، أو احذف كل شيء بإلغاء تثبيت التطبيق. لإدارة تخصيص الإعلانات، استخدم إعدادات النظام على جهازك. لإدارة اشتراكك أو إلغائه، استخدم شاشة إدارة الاشتراكات في Google Play أو App Store."],
      ["٧. الأطفال",
        "لا يستهدف Unfolloff الأطفال دون سن 13 عامًا (أو سن الموافقة الرقمية المعمول به في بلدك)، ولا نجمع عن قصد أي بيانات من الأطفال."],
      ["٨. التغييرات على هذه السياسة",
        "قد نُحدّث هذه السياسة من وقت لآخر. يعكس تاريخ \"آخر تحديث\" أعلاه أحدث نسخة. استمرارك في استخدام التطبيق بعد أي تغيير يعني قبولك للسياسة المحدَّثة."],
    ]
  },
};

function render(code) {
  const l = LANGS[code] || LANGS.en;
  document.documentElement.lang = code;
  document.documentElement.dir = l.dir;
  document.getElementById('title').textContent = l.title;
  document.title = l.title;
  document.getElementById('updated').textContent = l.updated;
  document.getElementById('contactLabel').textContent = l.contact;
  const content = document.getElementById('content');
  content.innerHTML = '';
  l.sections.forEach(([h, p]) => {
    const h2 = document.createElement('h2');
    h2.textContent = h;
    const para = document.createElement('p');
    para.innerHTML = p;
    content.appendChild(h2);
    content.appendChild(para);
  });
}

function init() {
  const select = document.getElementById('langSelect');
  Object.keys(LANGS).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANGS[code].name;
    select.appendChild(opt);
  });

  const params = new URLSearchParams(location.search);
  let initial = params.get('lang');
  if (!initial || !LANGS[initial]) {
    const browserLang = (navigator.language || 'en').split('-')[0];
    initial = LANGS[navigator.language] ? navigator.language
      : (LANGS[browserLang] ? browserLang : 'en');
  }

  select.value = initial;
  render(initial);

  select.addEventListener('change', () => render(select.value));
}

init();
</script>
